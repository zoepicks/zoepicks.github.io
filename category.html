<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" type="image/png" sizes="64x64" href="assets/logo-64.png"><link rel="apple-touch-icon" href="assets/logo-180.png"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Category — Zoe Picks</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css?v=5"></head><body>
<nav><div class="wrap"><a class="logo" href="./"><img class="lg" src="assets/logo-96.png" alt="Zoe Picks logo" width="28" height="28">Zoe <b>Picks</b></a><a class="l" href="./">← Home</a></div></nav>
<div class="cp-bar"><div class="cp-rail" id="cats" aria-label="Categories"></div></div>
<main class="wrap">
<section id="tk" class="cp-tk" hidden><div class="cp-tkh"><b>🔥 Top discounts</b><span id="tkn"></span></div><div class="cp-tkw"><div class="cp-tkt" id="tkt"></div></div></section>
<a id="bn" class="cp-bn" hidden></a>
<div class="cp-head"><h1 id="t">Guides</h1><span class="cp-count" id="cnt"></span><div class="cp-filters" id="f"></div></div>
<div class="cp-grid" id="l"><div class="empty">Loading…</div></div>
<div id="soon" class="cp-soon" hidden></div>
<p class="disc"><b>Disclosure:</b> As an Amazon Associate we earn from qualifying purchases. Prices are from the date shown and change often — check the store before buying.</p></main>
<script src="assets/site.js?v=3" data-root="."></script><script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const k=new URLSearchParams(location.search).get("c"),c=CATS.find(x=>x[0]==k);
t.textContent=c?c[2]:"All guides";document.title=(c?c[2]:"Guides")+" — Zoe Picks";
const DAY=864e5,now=Date.now();
const days=g=>g.expires?Math.ceil((new Date(g.expires+"T00:00:00-05:00")-now)/DAY):null;
const isDeal=g=>!!(g.expires&&days(g)>0);
const isBudget=g=>/under|budget|\$\d/i.test(g.title);
const short=s=>s.replace(/\s*\(2026\)\s*$/,"");const tshort=s=>short(s).replace(/^(Top|Best)\s+/i,"").replace(/\s+(for|to) (Better|Every|Fresh|Faster|Your|a)\b.*$/i,"");
async function jget(u){try{return await (await fetch(u,{cache:"no-store"})).json()}catch(e){return[]}}
const inCat=(x,key)=>x.category==key||x.cat==key||(x.also||[]).includes(key);
let ALL=[],mode="all";
function drawCats(D,G){
  const best={},hot={};G.filter(x=>isDeal(x)).forEach(x=>[x.category,...(x.also||[])].forEach(q=>hot[q]=1));D.filter(d=>d.ver).forEach(d=>[d.cat,...(d.also||[])].forEach(q=>best[q]=Math.max(best[q]||0,d.pct)));
  cats.innerHTML=[["","✨","All"],...CATS].map(x=>{const o=x[0]?best[x[0]]:Math.max(0,...Object.values(best)),h=x[0]?hot[x[0]]:Object.keys(hot).length;
    return `<a class="cp-cat${(x[0]==(k||""))?" on":""}${(o||h)?" hot":""}" href="category.html${x[0]?"?c="+x[0]:""}"><i>${x[1]}</i>${x[2]}${o?`<em>-${o}%</em>`:h?`<em>🔥</em>`:""}</a>`}).join("");
  const on=cats.querySelector(".on");if(on)cats.scrollLeft=on.offsetLeft-16}
function tile(g){const em=(CATS.find(x=>x[0]==g.category)||[0,"🛒"])[1],d=isDeal(g);
  const th=g.img?`<img src="${esc(g.img)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">`:"";
  return `<a class="cp-t${d?" dl":""}" href="g/${g.slug}/"><div class="cp-tth"><em>${em}</em>${th}</div><div class="cp-tin"><b>${esc(tshort(g.title))}</b><small>${g.top?"#1 "+esc(g.top):(g.n?g.n+" picks":"")}</small></div>${g.off?`<span class="cp-b red">-${g.off}%</span>`:d?`<span class="cp-b red">DEAL</span>`:""}</a>`}
function draw(){let g=ALL.filter(x=>!x.soon);
  if(mode=="deals")g=g.filter(isDeal);else if(mode=="budget")g=g.filter(isBudget);
  g.sort((a,b)=>(isDeal(b)-isDeal(a)));
  l.innerHTML=g.length?g.map(tile).join(""):'<div class="empty" style="grid-column:1/-1">Nothing here yet.</div>';
  cnt.textContent=g.length+" guides"}
Promise.all([guides(),jget("guides/deals.json")]).then(([g,D])=>{
  drawCats(D,g);
  g=g.filter(x=>!k||inCat(x,k));ALL=g;const live=g.filter(x=>!x.soon);
  const dd=D.filter(d=>d.ver&&(!k||inCat(d,k))).slice(0,5);
  if(dd.length){tk.hidden=false;tkn.textContent="also on Amazon · as of "+(dd[0].asof||"");
    const card=d=>`<div class="cp-tc"><a class="cp-tcm" href="g/${d.guide}/"><div class="cp-tci">${d.img?`<img src="${esc(d.img)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:"🏷️"}</div><div><span class="cp-pc">-${d.pct}%</span><b>${esc(d.name)}</b><small><strong>${esc(d.now)}</strong> <s>${esc(d.was)}</s></small></div></a>${d.link?`<a class="cp-az" href="${esc(d.link)}" target="_blank" rel="sponsored nofollow noopener">Buy on Amazon ↗</a>`:""}</div>`;
    const h=dd.map(card).join("");tkt.innerHTML=h+h}
  const bd=live.filter(isDeal).sort((a,b)=>(b.off||0)-(a.off||0))[0];
  if(bd){bn.hidden=false;bn.href="g/"+bd.slug+"/";const dl=days(bd);
    bn.innerHTML=`<div><small>🛍️ ${dl<=60?"Black Friday deals · ends in "+dl+" days":"Limited-time deals"}</small><b>${esc(short(bd.title).replace(/\s*\(.*\)/,""))}</b></div><span>${bd.off?"UP TO<br><i>"+bd.off+"%</i> OFF":"VIEW →"}</span>`}
  const fs=[["all","All"]];if(live.some(isDeal))fs.push(["deals","🔥 Deals"]);if(live.some(isBudget))fs.push(["budget","💰 Budget"]);
  f.innerHTML=fs.length>1?fs.map(x=>`<button class="cp-f${x[0]==mode?" on":""}" data-m="${x[0]}">${x[1]}</button>`).join(""):"";
  f.onclick=e=>{const b=e.target.closest("button");if(!b)return;mode=b.dataset.m;f.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x==b));draw()};
  draw();
  const so=g.filter(x=>x.soon);if(so.length){soon.hidden=false;soon.innerHTML="<b>Coming soon</b>"+so.map(x=>`<span>${esc(short(x.title))}</span>`).join("")}
});document.querySelector(".cp-bar").style.top=document.querySelector("nav").offsetHeight+"px";</script></body></html>
