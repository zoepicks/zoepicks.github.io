<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Category — Zoe Picks</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css?v=3"></head><body>
<nav><div class="wrap"><a class="logo" href="./">Zoe <b>Picks</b></a><a class="l" href="./">← Home</a></div></nav>
<div class="cp-bar"><div class="cp-rail" id="cats" aria-label="Categories"></div></div>
<main class="wrap">
<div class="cp-head"><h1 id="t">Guides</h1><span class="cp-count" id="cnt"></span></div>
<div class="cp-filters" id="f"></div>
<section id="deals" hidden><h2 class="cp-h">🔥 Live deals</h2><div class="cp-deals" id="dl"></div></section>
<div class="cp-grid" id="l"><div class="empty">Loading…</div></div>
<div id="soon" class="cp-soon" hidden></div>
<p class="disc"><b>Disclosure:</b> As an Amazon Associate we earn from qualifying purchases.</p></main>
<script src="assets/site.js?v=3" data-root="."></script><script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const k=new URLSearchParams(location.search).get("c"),c=CATS.find(x=>x[0]==k);
t.textContent=c?c[2]:"All guides";document.title=(c?c[2]:"Guides")+" — Zoe Picks";
cats.innerHTML=[["", "✨","All"],...CATS].map(x=>`<a class="cp-cat${(x[0]==(k||""))?" on":""}" href="category.html${x[0]?"?c="+x[0]:""}"><i>${x[1]}</i>${x[2]}</a>`).join("");
document.querySelector(".cp-bar").style.top=document.querySelector("nav").offsetHeight+"px";const on=cats.querySelector(".on");if(on)cats.scrollLeft=on.offsetLeft-16;
const DAY=864e5,now=Date.now();
const days=g=>g.expires?Math.ceil((new Date(g.expires+"T00:00:00-05:00")-now)/DAY):null;
let NEWOK=true;const isNew=g=>NEWOK&&g.date&&now-new Date(g.date)<3*DAY;
const isDeal=g=>g.expires&&days(g)>0;
const isBudget=g=>/under|budget|\$\d/i.test(g.title);
function card(g){
  const em=(CATS.find(x=>x[0]==g.category)||[0,"🛒"])[1],d=isDeal(g);
  const th=g.img?`<img src="${esc(g.img)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">`:"";
  const bd=g.off?`<span class="cp-b red">UP TO ${g.off}% OFF</span>`:d?`<span class="cp-b red">🔥 DEAL</span>`:isNew(g)?`<span class="cp-b new">NEW</span>`:"";
  return `<a class="cp-card" href="g/${g.slug}/"><div class="cp-th"><em>${em}</em>${th}${bd}</div><div class="cp-in"><b>${esc(g.title.replace(/\s*\(2026\)\s*$/,""))}</b>${g.top?`<small class="cp-top">#1 ${esc(g.top)}</small>`:""}<small class="cp-meta">${g.n?g.n+" picks · ":""}${g.date||""}</small></div></a>`}
function dealCard(g){const dl=days(g),th=g.img?`<img src="${esc(g.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:"";
  return `<a class="cp-deal" href="g/${g.slug}/">${th}<span class="cp-b red">${g.off?"UP TO "+g.off+"% OFF":"LIVE DEAL"}</span><b>${esc(g.title.replace(/\s*\(.*\)\s*$/,""))}</b><small>${dl<=60?`Ends in ${dl} day${dl==1?"":"s"}`:"Limited time"} →</small></a>`}
let ALL=[],mode="all";
function draw(){
  let g=ALL.filter(x=>!x.soon);
  if(mode=="deals")g=g.filter(isDeal);else if(mode=="budget")g=g.filter(isBudget);else if(mode=="new")g=g.filter(isNew);
  g.sort((a,b)=>(isDeal(b)-isDeal(a)));
  l.innerHTML=g.length?g.map(card).join(""):'<div class="empty" style="grid-column:1/-1">Nothing here yet — try another filter.</div>';
  cnt.textContent=g.length+" guide"+(g.length==1?"":"s");
}
guides().then(g=>{
  g=g.filter(x=>!k||x.category==k||(x.also||[]).includes(k));ALL=g;
  const live=g.filter(x=>!x.soon),dl_=live.filter(isDeal);NEWOK=live.filter(x=>now-new Date(x.date)<3*DAY).length<live.length*.5;
  if(dl_.length){deals.hidden=false;dl.innerHTML=dl_.map(dealCard).join("")}
  const fs=[["all","All"]];if(dl_.length)fs.push(["deals","🔥 Deals ("+dl_.length+")"]);
  if(live.some(isBudget))fs.push(["budget","💰 Budget"]);if(live.some(isNew))fs.push(["new","🆕 New"]);
  f.innerHTML=fs.map(x=>`<button class="cp-f${x[0]==mode?" on":""}" data-m="${x[0]}">${x[1]}</button>`).join("");
  f.onclick=e=>{const b=e.target.closest("button");if(!b)return;mode=b.dataset.m;f.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x==b));draw()};
  draw();
  const so=g.filter(x=>x.soon);if(so.length){soon.hidden=false;soon.innerHTML="<b>Coming soon</b>"+so.map(x=>`<span>${esc(x.title.replace(/\s*\(2026\)\s*$/,""))}</span>`).join("")}
});</script></body></html>
