name: Collect guide data
# Bot collects data for the next "todo" topic from the best review sites, builds the guide, renders it.
# Runs on GitHub's servers, so it does not depend on any chat/window being open.
# STEP 1: add repo secrets GROQ_API_KEY (and optionally OPENROUTER_API_KEY, TAVILY_API_KEY), then run this manually once (Actions tab).
# STEP 2: when the result looks good, uncomment the schedule lines below (1 topic every 6h).
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Specific topic slug (empty = next todo by priority)"
        required: false
  schedule:
    - cron: "40 */6 * * *"
permissions:
  contents: write
concurrency:
  group: render-guides
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests beautifulsoup4 lxml
      - name: Collect + build one guide
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python3 tools/collect_guide.py ${{ github.event.inputs.slug && format('--slug {0}', github.event.inputs.slug) || '' }}
      - name: Commit
        run: |
          git config user.name "zoe-collector-bot"
          git config user.email "zoe-collector-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else git commit -m "collect: new guide data"; git pull --rebase -q; git push; fi
